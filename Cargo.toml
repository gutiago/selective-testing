[package]
name = "selective-testing"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Test Impact Analysis for Swift/Xcode projects"

[[bin]]
name = "selective-testing"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
git2 = "0.19"
petgraph = { version = "0.6", features = ["serde-1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1"
rayon = "1.10"
walkdir = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tree-sitter = "0.25"
tree-sitter-swift = "0.7"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
