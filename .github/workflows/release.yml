name: Release

on:
  push:
    branches:
      - master

jobs:
  release:
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get latest tag
        id: latest_tag
        run: |
          TAG=$(git tag --sort=-v:refname | head -n 1)
          if [ -z "$TAG" ]; then
            echo "version=1.0.0" >> "$GITHUB_OUTPUT"
            echo "first_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=$TAG" >> "$GITHUB_OUTPUT"
            echo "first_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine bump type from commit message
        id: bump_type
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B)
          if echo "$COMMIT_MSG" | head -1 | grep -iq '^(major)'; then
            echo "type=major" >> "$GITHUB_OUTPUT"
          elif echo "$COMMIT_MSG" | head -1 | grep -iq '^(patch)'; then
            echo "type=patch" >> "$GITHUB_OUTPUT"
          else
            echo "type=minor" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump version
        id: bump
        run: |
          if [ "${{ steps.latest_tag.outputs.first_release }}" = "true" ]; then
            NEW_VERSION="1.0.0"
          else
            IFS='.' read -r major minor patch <<< "${{ steps.latest_tag.outputs.version }}"
            TYPE="${{ steps.bump_type.outputs.type }}"
            if [ "$TYPE" = "major" ]; then
              NEW_VERSION="$((major + 1)).0.0"
            elif [ "$TYPE" = "minor" ]; then
              NEW_VERSION="${major}.$((minor + 1)).0"
            else
              NEW_VERSION="${major}.${minor}.$((patch + 1))"
            fi
          fi
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Rust CLI
        run: cargo build --release

      - name: Build Swift helper
        run: cd swift-helper && swift build --configuration release

      - name: Strip binaries
        run: |
          strip target/release/selective-testing
          strip swift-helper/.build/release/index-helper

      - name: Package binaries
        run: |
          mkdir -p dist
          cp target/release/selective-testing dist/
          cp swift-helper/.build/release/index-helper dist/
          tar czf selective-testing-darwin-arm64.tar.gz -C dist .

      - name: Create tag and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag ${{ steps.bump.outputs.version }}
          git push origin --tags

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.bump.outputs.version }}
          name: ${{ steps.bump.outputs.version }}
          files: selective-testing-darwin-arm64.tar.gz
          generate_release_notes: true

      - name: Update Homebrew formula
        env:
          GH_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          SHA=$(shasum -a 256 selective-testing-darwin-arm64.tar.gz | cut -d' ' -f1)
          VERSION=${{ steps.bump.outputs.version }}

          git clone https://x-access-token:${GH_TOKEN}@github.com/gutiago/homebrew-tap.git /tmp/homebrew-tap
          cd /tmp/homebrew-tap

          sed -i '' "s|url \".*\"|url \"https://github.com/gutiago/selective-testing/releases/download/${VERSION}/selective-testing-darwin-arm64.tar.gz\"|" Formula/selective-testing.rb
          sed -i '' "s|sha256 \".*\"|sha256 \"${SHA}\"|" Formula/selective-testing.rb

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add Formula/selective-testing.rb
          git diff --cached --quiet || git commit -m "Update selective-testing to ${VERSION}"
          git push
