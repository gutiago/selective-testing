name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14  # Apple Silicon
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Rust CLI
        run: cargo build --release

      - name: Build Swift helper
        run: cd swift-helper && swift build --configuration release

      - name: Package binaries
        run: |
          mkdir -p dist
          cp target/release/selective-testing dist/
          cp swift-helper/.build/release/index-helper dist/
          tar czf selective-testing-darwin-arm64.tar.gz -C dist .

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: selective-testing-darwin-arm64.tar.gz
